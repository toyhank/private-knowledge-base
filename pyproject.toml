[project]
name = "private-knowledge-base"
version = "0.1.0"
description = "Local document retrieval and grounded question answering"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "qdrant-client>=1.15,<2",
  "sentence-transformers>=4.1,<6", "transformers>=4.51,<5", "torch==2.8.0",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "sentencepiece>=0.2,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "benchmark"]

[tool.ruff]
line-length = 110

