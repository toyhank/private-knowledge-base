services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      MODEL_CACHE: /app/models
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
volumes:
  qdrant_data:
